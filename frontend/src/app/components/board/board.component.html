<div class="board" aria-label="Tic Tac Toe board">
  @for (cell of board(); track $index) {
    <button
      type="button"
      class="cell"
      [class.x]="cell === 'X'"
      [class.o]="cell === 'O'"
      [class.winning]="isWinning($index)"
      [disabled]="disabled() || cell !== null"
      [attr.aria-label]="label($index, cell)"
      (click)="cellSelected.emit($index)"
    >{{ cell }}</button>
  }
</div>
