<div class="scores">
  <div class="tile x">
    <span class="label">X wins</span>
    <strong data-testid="x-wins">{{ scoreboard().xWins }}</strong>
  </div>
  <div class="tile draws">
    <span class="label">Draws</span>
    <strong data-testid="draws">{{ scoreboard().draws }}</strong>
  </div>
  <div class="tile o">
    <span class="label">O wins</span>
    <strong data-testid="o-wins">{{ scoreboard().oWins }}</strong>
  </div>
</div>
